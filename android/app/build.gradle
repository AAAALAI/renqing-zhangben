plugins {
    id 'com.android.application'
}

android {
    namespace 'com.renqing.zhangben'
    compileSdk 34

    defaultConfig {
        applicationId "com.renqing.zhangben"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    // 固定签名，保证每次云端打包签名一致，新版本可以直接覆盖安装、数据不丢
    signingConfigs {
        release {
            storeFile file("../keystore/renqing-release.jks")
            storePassword "renqing2026"
            keyAlias "renqing"
            keyPassword "renqing2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // 用 https 虚拟域名加载本地 assets，保证 IndexedDB / localStorage 可用
    implementation 'androidx.webkit:webkit:1.10.0'
}
