name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug and Release APK
        working-directory: android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/人情账本-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/人情账本-debug.apk
          ls -lh dist/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: renqing-zhangben-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish Release (public download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 人情账本 APK（最新构建）
          body: |
            由 GitHub Actions 自动构建，来源提交 ${{ github.sha }}。
            - 人情账本-release.apk：正式签名版，可直接安装覆盖升级
            - 人情账本-debug.apk：调试版
          files: dist/*.apk
          overwrite_files: true
